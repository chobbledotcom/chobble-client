name: Shared Build and Deploy

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label'
        type: string
        default: 'ubicloud-standard-8'
      deploy-only-on-main:
        description: 'Deprecated and ignored: only main deploys. Remove it from callers.'
        type: boolean
        default: false
      check-duplicated-code:
        description: 'Run the site''s cpd checks before building'
        type: boolean
        default: false
      template-ref:
        description: 'Chobble Template commit to build with. Defaults to the last v1 commit, before v2 landed on main.'
        type: string
        default: '9a3d6b3f400018c1589ef9a2bebf56fe930980ce'
      standalone:
        description: 'Build the calling repo on its own with npm (a Chobble Template v2 site) instead of merging it over the v1 template'
        type: boolean
        default: false
      ref:
        description: 'Commit to build; the commit that started the run when empty'
        type: string
        default: ''
    secrets:
      INDEXNOW_KEY:
        required: false
      FORMSPARK_ID:
        required: false
      BOTPOISON_PUBLIC_KEY:
        required: false
      BUNNY_ACCESS_KEY:
        required: false
      BUNNY_STORAGE_ZONE_NAME:
        required: false
      # Older sites' name for BUNNY_STORAGE_ZONE_NAME, used when that is unset
      BUNNY_PRODUCTION_STORAGE_ZONE_NAME:
        required: false
      # Deprecated and ignored: branches no longer deploy. Remove it from callers.
      BUNNY_STAGING_STORAGE_ZONE_NAME:
        required: false
      NTFY_TOPIC:
        required: false

jobs:
  build:
    name: Build and Deploy
    runs-on: ${{ inputs.runs-on }}
    env:
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      BUNNY_STORAGE_ZONE_NAME: ${{ secrets.BUNNY_STORAGE_ZONE_NAME || secrets.BUNNY_PRODUCTION_STORAGE_ZONE_NAME }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v5
        with:
          # A standalone site is the whole build, so it goes where the merged
          # template and site would otherwise be assembled.
          path: ${{ inputs.standalone && 'combined' || 'source' }}
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Checkout Chobble Template
        if: ${{ !inputs.standalone }}
        uses: actions/checkout@v5
        with:
          repository: chobble-mirror/chobble-template
          ref: ${{ inputs.template-ref }}
          path: template
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .eleventy.js
            package.json
            bun.lock
            bunfig.toml
            flake.nix
            flake.lock
            bin
            scripts
            packages
            src

      - name: Setup Bun
        if: ${{ !inputs.standalone }}
        uses: oven-sh/setup-bun@v2

      - name: Setup Node
        if: inputs.standalone
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check for duplicated code
        if: ${{ inputs.check-duplicated-code && !inputs.standalone }}
        run: |
          cd source
          bun run cpd
          bun run cpd:ratchet

      - name: Merge repos
        if: ${{ !inputs.standalone }}
        run: bun source/scripts/ci-merge.js template source combined

      - name: Update site.json with secrets
        if: ${{ !inputs.standalone }}
        run: |
          sed -i \
            's/"formspark_id": null/"formspark_id": "${{ secrets.FORMSPARK_ID }}"/g' \
            "combined/src/_data/config.json"
          sed -i \
            's/"botpoison_public_key": null/"botpoison_public_key": "${{ secrets.BOTPOISON_PUBLIC_KEY }}"/g' \
            "combined/src/_data/config.json"

      # A v2 config.json lists only the settings a site has changed, so the
      # form IDs are added as keys rather than swapped in for null values.
      - name: Update config.json with secrets (standalone)
        if: inputs.standalone
        env:
          FORMSPARK_ID: ${{ secrets.FORMSPARK_ID }}
          BOTPOISON_PUBLIC_KEY: ${{ secrets.BOTPOISON_PUBLIC_KEY }}
        run: |
          jq --arg formspark "$FORMSPARK_ID" --arg botpoison "$BOTPOISON_PUBLIC_KEY" '
            (if $formspark != "" then .formspark_id = $formspark else . end)
            | (if $botpoison != "" then .botpoison_public_key = $botpoison else . end)
          ' combined/src/_data/config.json > config.tmp.json
          mv config.tmp.json combined/src/_data/config.json

      - name: Restore cache
        uses: actions/cache@v5
        with:
          path: |
            combined/node_modules
            combined/.image-cache
          key: ${{ runner.os }}-bun-${{ hashFiles('combined/bun.lock', 'combined/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Build with Bun
        if: ${{ !inputs.standalone }}
        env:
          GIT_DATES_REPO: ../source
        run: |
          cd combined
          bun install --frozen-lockfile
          bun scripts/eleventy-build.js
          mkdir -p ../_site
          mv _site/* ../_site/

      # The repository's docs/ (the generated Site Builder Reference) publish
      # alongside the site at /docs/.
      - name: Build with npm (standalone)
        if: inputs.standalone
        run: |
          cd combined
          npm ci
          npm run build
          if [ -d docs ]; then cp -r docs _site/; fi
          mkdir -p ../_site
          mv _site/* ../_site/

      - name: Normalise paths and links
        run: |
          for script in fix-wp-paths fix-relative-paths fix-links; do
            if [ -f "source/scripts/$script.js" ]; then
              echo "Running $script.js"
              bun "source/scripts/$script.js" _site
            fi
          done

      - name: Write IndexNow key file
        if: github.ref == 'refs/heads/main' && env.INDEXNOW_KEY != ''
        run: echo "${{ secrets.INDEXNOW_KEY }}" > "_site/${{ secrets.INDEXNOW_KEY }}.txt"

      # Only main deploys; other branches just build, as a check.
      - name: Deploy to Bunny CDN
        if: github.ref == 'refs/heads/main' && env.BUNNY_STORAGE_ZONE_NAME != ''
        uses: BunnyWay/actions/deploy-site@deploy-site_0.1.1
        with:
          site: ${{ env.BUNNY_STORAGE_ZONE_NAME }}
          directory: _site
          api_key: ${{ secrets.BUNNY_ACCESS_KEY }}
          cli_version: "0.19"
          deployments: true

      - name: Get site URL
        id: site-url
        run: echo "url=$(jq -r '.url' combined/src/_data/site.json)" >> $GITHUB_OUTPUT

      - name: Submit to IndexNow
        if: github.ref == 'refs/heads/main' && env.INDEXNOW_KEY != ''
        uses: bojieyang/indexnow-action@v3
        with:
          sitemap-location: "${{ steps.site-url.outputs.url }}/sitemap.xml"
          key: ${{ secrets.INDEXNOW_KEY }}
          since: 1
          since-unit: day

  notify-failure:
    name: Notify on Failure
    runs-on: ${{ inputs.runs-on }}
    needs: [build]
    if: failure()
    steps:
      - name: Send failure notification
        uses: NiNiyas/ntfy-action@master
        with:
          url: 'https://ntfy.sh'
          topic: ${{ secrets.NTFY_TOPIC }}
