name: Shared Build and Deploy

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label'
        type: string
        default: 'ubicloud-standard-8'
      deploy-only-on-main:
        description: 'Only deploy on main branch (no staging)'
        type: boolean
        default: false
    secrets:
      INDEXNOW_KEY:
        required: false
      FORMSPARK_ID:
        required: false
      BOTPOISON_PUBLIC_KEY:
        required: false
      BUNNY_ACCESS_KEY:
        required: false
      BUNNY_PRODUCTION_STORAGE_ZONE_NAME:
        required: false
      BUNNY_STAGING_STORAGE_ZONE_NAME:
        required: false
      NTFY_TOPIC:
        required: false

jobs:
  build:
    name: Build and Deploy
    runs-on: ${{ inputs.runs-on }}
    env:
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v5
        with:
          path: source
          fetch-depth: 0

      - name: Checkout Chobble Template
        uses: actions/checkout@v5
        with:
          repository: chobble-mirror/chobble-template
          ref: main
          path: template
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .eleventy.js
            package.json
            bun.lock
            bunfig.toml
            flake.nix
            flake.lock
            bin
            scripts
            packages
            src

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Merge repos
        run: bun source/scripts/ci-merge.js template source combined

      - name: Update site.json with secrets
        run: |
          sed -i \
            's/"formspark_id": null/"formspark_id": "${{ secrets.FORMSPARK_ID }}"/g' \
            "combined/src/_data/config.json"
          sed -i \
            's/"botpoison_public_key": null/"botpoison_public_key": "${{ secrets.BOTPOISON_PUBLIC_KEY }}"/g' \
            "combined/src/_data/config.json"

      - name: Restore cache
        uses: actions/cache@v5
        with:
          path: |
            combined/node_modules
            combined/.image-cache
          key: ${{ runner.os }}-bun-${{ hashFiles('combined/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Build with Bun
        env:
          GIT_DATES_REPO: ../source
        run: |
          cd combined
          bun install --frozen-lockfile
          bun scripts/eleventy-build.js
          mkdir -p ../_site
          mv _site/* ../_site/

      - name: Write IndexNow key file
        if: github.ref == 'refs/heads/main' && env.INDEXNOW_KEY != ''
        run: echo "${{ secrets.INDEXNOW_KEY }}" > "_site/${{ secrets.INDEXNOW_KEY }}.txt"

      - name: Set deployment environment
        id: deployment_env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "storage_zone_name=${{ secrets.BUNNY_PRODUCTION_STORAGE_ZONE_NAME }}" >> $GITHUB_OUTPUT
          else
            echo "storage_zone_name=${{ secrets.BUNNY_STAGING_STORAGE_ZONE_NAME }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Bunny CDN
        if: steps.deployment_env.outputs.storage_zone_name != '' && (inputs.deploy-only-on-main == false || github.ref == 'refs/heads/main')
        uses: BunnyWay/actions/deploy-site@deploy-site_0.1.1
        with:
          site: ${{ steps.deployment_env.outputs.storage_zone_name }}
          directory: _site
          api_key: ${{ secrets.BUNNY_ACCESS_KEY }}
          cli_version: "0.19"
          deployments: true

      - name: Get site URL
        id: site-url
        run: echo "url=$(jq -r '.url' combined/src/_data/site.json)" >> $GITHUB_OUTPUT

      - name: Submit to IndexNow
        if: github.ref == 'refs/heads/main' && env.INDEXNOW_KEY != ''
        uses: bojieyang/indexnow-action@v3
        with:
          sitemap-location: "${{ steps.site-url.outputs.url }}/sitemap.xml"
          key: ${{ secrets.INDEXNOW_KEY }}
          since: 1
          since-unit: day

  notify-failure:
    name: Notify on Failure
    runs-on: ${{ inputs.runs-on }}
    needs: [build]
    if: failure()
    steps:
      - name: Send failure notification
        uses: NiNiyas/ntfy-action@master
        with:
          url: 'https://ntfy.sh'
          topic: ${{ secrets.NTFY_TOPIC }}
